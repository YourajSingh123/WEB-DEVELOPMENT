<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        header {
            position: sticky;
            top: 0;
        }

        nav {
            background-color: palevioletred;
            padding: 15px;
        }

        ul li {
            list-style: none;
            display: inline;
            padding: 20px;
            font-weight: bolder;
        }

        main {
            background-color: black;
            color: whitesmoke;
            padding: 20px;
        }

        .container {
            background-color: rgb(7, 224, 159);
            margin: 10px 30px;
            padding: 50px 20px;
            text-align: center;
            /* display: flex; */
        }

        .box1 {
            width: 45%;
            height: 70vh;
            background-color: rgb(191, 205, 32);
            display: inline-block;
            margin: 0px 10px;
        }

        .box2 {
            width: 45%;
            height: 70vh;
            background-color: rgb(16, 157, 189);
            display: inline-block;
            margin: 0px 10px;
        }

        .text-box {
            padding: 30px;
            border: 2px solid whitesmoke;
            margin: 40px 30vw;
            font-size: 2em;
            border-radius: 20px;
        }

        .orange-box{
            height: 40px;
            width: 40px;
            background-color: orange;
            position: fixed;
            bottom: 10px;
            right: 6px;
            border-radius: 60px;
        }
        footer {
            background-color: rgb(121, 208, 214);
            height: 100px;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>

        <div class="text-box">
            welcome to Yuvraj Motors....
        </div>

        <div class="orange-box"></div>
    </main>

    <footer>

    </footer>
</body>
</html>
