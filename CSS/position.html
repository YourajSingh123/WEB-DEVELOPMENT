<!DOCTYPE html>
<html lang="en">

<head>
    <title>Position Property</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            border: 2px solid brown;
            height: 400px;
            width: 80vw;
            margin: 3px;
            padding: 3px;
        }

        .box1 {
            background-color: orange;
            /* position: sticky;
            top: 0px;
            height: 120px;
            width: 100%;
            margin: 0;
            padding: 0; */
            position: absolute;
            top: 2px;
            left: 4px;
            z-index: 1px;
        }

        .box2 {
            background-color: beige;
            /* position: relative;
            top: 30px;
            left: 40px; */
        }

        .box3 {
            background-color: blue;
            /* position: fixed;
            top: 480px;
            left: 8vw;
            height: 100px; */
        }

        .box4 {
            background-color: green;
        }

        .parent {
            margin: 30px;
            padding: 40px;
            border: 2px solid purple;
            position: absolute;
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>

</html>
