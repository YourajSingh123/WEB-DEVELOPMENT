<!-- design a nav bar using flexbox!!! -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 6</title>
    <style>
      .logo img{
         width: 120px;
      }

      nav{
         display: flex;
         justify-content: space-around;
         align-items: center;
         font-family: 'Segoe UI';
      }

      .right ul{
         display: flex;
         gap: 30px;
      }

      .right ul li{
         list-style: none;
         display: flex;
         align-items: center;
         cursor: pointer;
      }

      .right ul li span{
         padding: 0 5px;
      }
    </style>
 </head>
 <body>
    <header>
      <nav>
         <div class="logo">

         </div>
         <div class="right">
            <ul>
               <li><span>Products</span> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
               <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9"></path>
               </svg></li>

               <li><span>Pricing</span> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

               <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9"></path>
               </svg></li>

               <li><span>About Us</span> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
               <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9"></path>

         </div>
      </nav>
    </header>
