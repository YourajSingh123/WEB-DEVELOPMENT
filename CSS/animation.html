<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation</title>
    <style>
        .container{
            background-color: chartreuse;
            height: 80vh;
            width: 30vw;
        }

        .box{
            width: 35px;
            height: 45px;
            /* animation: YuviKaAnimation;
            animation-duration: 1s;
            animation-iteration-count: infinite;
            animation-timing-function: cubic-bezier(0, 0, 0, 0.96);
            animation-delay: 5s;
            animation-direction: alternate-reverse;
            animation-play-state: paused; */
            
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */
            animation: YuviKaAnimation 1s cubic-bezier(0, 0, 0, 0.96) 2s 2 alternate-reverse forwards,
                       yuvii2 1s ease-in-out 2s 1;
        }

        @keyframes YuviKaAnimation {
            from{
                background-color: red;
            }
            to{
                background-color: yellow;
                transform: translateX(800px);
            }
        }

        @keyframes yuvii2 {
            0%{
                transform: rotate(90deg);
            }
            20%{
                transform: rotate(120deg);
            }
            50%{
                transform: rotate(180deg);
            }
            80%{
                transform: rotate(220deg);
            }
            100%{
                transform: rotate(270deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            BOX
        </div>
    </div>
</body>
</html>
