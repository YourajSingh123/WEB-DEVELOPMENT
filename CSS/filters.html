<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>
    <style>
        /* img{
            filter: blur(5px);
        } */

        .img1{
            filter: brightness(110%);
            /* filter: invert(.4); */
            /* filter: opacity(.6); */
        }
        .img2{
            /* filter: grayscale(100%); */
            filter: sepia(100%);
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="img1" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRQ23_Dw0VH1VRv4pojs5J_SJbytfxm-Z4RfgdbIoouPA&s=10" alt="">
        <img class="img2" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSSnAwotC66NnlSedip_WEufKR6H1ulZJTz0X1uhsZ7ng&s=10" alt="">
    </div>
</body>
</html>
